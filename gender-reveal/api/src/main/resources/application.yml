server:
  port: 8080

spring:
  application:
    name: gender-reveal-api
  datasource:
    url: jdbc:sqlite:${GENDER_REVEAL_DB_PATH:./data/gender-reveal.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
