server:
  port: 8080

spring:
  application:
    name: gender-reveal-api
  datasource:
    url: jdbc:sqlite:${GENDER_REVEAL_DB_PATH:./data/gender-reveal.db}?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  session-cookie-secure: ${APP_SESSION_COOKIE_SECURE:false}
  resend:
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:젠더리빌 <onboarding@resend.dev>}
    api-url: https://api.resend.com/emails
