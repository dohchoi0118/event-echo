services:
  api:
    build:
      context: ./api
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - APP_BASE_URL=http://localhost
    ports:
      - "8080:8080"
    volumes:
      - api-data:/app/data

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  api-data:
