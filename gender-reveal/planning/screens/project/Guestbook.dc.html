    </div>

  <p style="position: absolute; bottom: 16px; left: 24px; right: 24px; margin: 0; font-size: 10px; color: #C7C0B2; text-align: center;">
    닉네임으로만 구분되며 여러 번 남길 수 있어요 · 부적절한 글은 관리자가 숨길 수 있어요
